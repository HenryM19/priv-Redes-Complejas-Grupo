<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><title>Grafo de ataque</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');
  :root{--bg:#0d1320;--panel:#121a2b;--line:#1e2a40;--txt:#e8edf6;--muted:#8a97ad;--crit:#ff3b5c;--high:#ff8c42;--cyan:#3fb6ff;--green:#5ad1a0;--amber:#ffd23f}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1920px;height:1080px;overflow:hidden;background:var(--bg);font-family:'Space Grotesk',sans-serif;color:var(--txt)}
  .slide{width:1920px;height:1080px;position:relative;display:flex;flex-direction:column;padding:80px 110px}
  .slide::before{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:64px 64px;opacity:.30;pointer-events:none}
  .masthead{display:flex;justify-content:space-between;align-items:baseline;font-family:'JetBrains Mono',monospace;font-size:17px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase;border-bottom:1px solid var(--line);padding-bottom:18px;z-index:2}
  .head{z-index:2;margin-top:32px;display:flex;justify-content:space-between;align-items:flex-end}
  .secno{font-family:'JetBrains Mono',monospace;font-size:19px;letter-spacing:.28em;color:var(--cyan)}
  h2{font-size:62px;font-weight:700;letter-spacing:-.02em;margin-top:10px}
  .chips{display:flex;gap:14px}
  .chip{font-family:'JetBrains Mono',monospace;font-size:16px;border:1px solid var(--line);background:var(--panel);border-radius:20px;padding:9px 18px;color:var(--muted)}
  .chip b{color:var(--cyan)}
  .body{flex:1;display:flex;align-items:center;justify-content:center;z-index:2;min-height:0;margin-top:14px}
  .fig{border:1px solid var(--line);background:#0a0f1a;border-radius:12px;padding:16px;box-shadow:0 24px 60px rgba(0,0,0,.5);max-height:760px;display:flex;flex-direction:column;align-items:center}
  .fig img{max-width:100%;max-height:700px;width:auto;display:block;border-radius:6px}
  .footer{display:flex;justify-content:space-between;font-family:'JetBrains Mono',monospace;font-size:16px;color:var(--muted);z-index:2}
</style>
</head>
<body>
<div class="slide">
  <div class="masthead"><span>Dijkstra · Grafo de Ataque</span><span>Topología</span></div>
  <div class="head">
    <div>
      <div class="secno">03 — EL GRAFO</div>
      <h2>De Internet al activo crítico</h2>
    </div>
    <div class="chips"><span class="chip"><b>11</b> nodos</span><span class="chip"><b>16</b> aristas (CVE)</span><span class="chip"><b>6</b> capas</span></div>
  </div>
  <div class="body">
    <div class="fig"><img src="../assets/img/attack_graph.png" alt="Grafo de ataque por capas"></div>
  </div>
  <div class="footer"><span>Universidad de Cuenca · DEET · color de arista = severidad CVSS</span><span>04 / 08</span></div>
</div>
</body>
</html>
