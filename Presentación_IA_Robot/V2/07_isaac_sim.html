<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>07 · Isaac Sim a Escala</title>
<script>document.documentElement.dataset.theme = (function(){try{return localStorage.getItem('ic-theme')||'dark'}catch(e){return 'dark'}})();</script>
<link rel="stylesheet" href="theme.css">
<style>
.diagram { width:100%; max-width:92vw; animation:fadeIn .8s .2s ease both; }
.diagram svg { width:100%; height:auto; max-height:26vh; }
.lbl  { font-size:26px; font-weight:800; }
.lbl2 { font-size:21px; }

.videos { display:flex; gap:2.5vw; align-items:stretch; width:100%; max-width:92vw; justify-content:center; flex:1; min-height:0; }
.vbox { display:flex; flex-direction:column; gap:0.6rem; animation:pop .6s 1.2s ease both; min-height:0; }
.vbox.big   { flex:1.6; }
.vbox.small { flex:1; }
.vframe { flex:1; min-height:0; display:flex; }

</style>
</head>
<body>
<div class="brand"><img src="assets/logo_ucuenca.png" alt="UCUENCA"></div>
<div class="slide">
    <div class="head">
        <h2>Entrenar sin ecuaciones: Isaac Sim</h2>
        <p class="sub">El brazo modelado con IA aprende de cero — 64 copias a la vez, nadie escribió la cinemática</p>
    </div>

    <!-- ════════ Esquema: pipeline + lazo de aprendizaje por refuerzo ════════ -->
    <div class="diagram">
    <svg viewBox="0 0 1500 270" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
                <path d="M0,0 L10,5 L0,10 z" fill="var(--line)"/>
            </marker>
        </defs>

        <!-- URDF -->
        <rect x="20" y="85" width="180" height="105" rx="14" class="svg-box"/>
        <text x="65" y="130" class="svg-title lbl">📐 URDF</text>
        <text x="48" y="165" class="svg-muted lbl2">Claude + Blender</text>
        <path d="M200,137 L258,137" class="svg-line" marker-end="url(#arr)"/>

        <!-- USD -->
        <rect x="260" y="85" width="170" height="105" rx="14" class="svg-box"/>
        <text x="305" y="130" class="svg-title lbl">🌐 USD</text>
        <text x="305" y="165" class="svg-muted lbl2">Isaac Sim</text>
        <path d="M430,137 L488,137" class="svg-line" marker-end="url(#arr)"/>

        <!-- contenedor del lazo RL -->
        <rect x="490" y="14" width="630" height="242" rx="18" fill="var(--diagram-fill)"
              stroke="var(--card-border)" stroke-width="2" stroke-dasharray="10 8"/>
        <text x="520" y="50" class="svg-accent lbl2" font-weight="800">APRENDIZAJE POR REFUERZO · PPO sobre GPU</text>

        <!-- política -->
        <rect x="525" y="95" width="225" height="110" rx="14" class="svg-box-hot"/>
        <text x="565" y="143" class="svg-title lbl">🧠 Política</text>
        <text x="567" y="178" class="svg-muted lbl2">red neuronal</text>

        <!-- entornos -->
        <rect x="860" y="95" width="230" height="110" rx="14" class="svg-box-hot"/>
        <text x="882" y="143" class="svg-title lbl">⚡ 64 entornos</text>
        <text x="898" y="178" class="svg-muted lbl2">en paralelo</text>

        <!-- lazo: acciones / observaciones -->
        <path d="M750,115 C 790,95 820,95 858,115" class="svg-dash" marker-end="url(#arr)"/>
        <text x="765" y="86" class="svg-text lbl2">acciones</text>
        <path d="M860,188 C 820,210 790,210 752,188" class="svg-dash" marker-end="url(#arr)"/>
        <text x="700" y="242" class="svg-text lbl2">observaciones + recompensa ↑</text>

        <!-- salida -->
        <path d="M1120,137 L1178,137" class="svg-line" marker-end="url(#arr)"/>
        <rect x="1180" y="85" width="300" height="105" rx="14" class="svg-box-hot"/>
        <text x="1212" y="130" class="svg-title lbl">📦 Política ONNX</text>
        <text x="1218" y="165" class="svg-muted lbl2">lista para desplegar</text>
    </svg>
    </div>

    <!-- ════════ Evidencia en video ════════ -->
    <div class="videos">
        <div class="vbox big">
            <div class="vframe">
                <video controls muted loop autoplay playsinline>

                </video>
            </div>
            <div class="vcap"><b>Entrenamiento masivo</b> · 64 brazos en paralelo · tarea reach-point</div>
        </div>
        <div class="vbox small">

            </div>
            <div class="vcap"><b>Resultado</b> · política ya entrenada</div>
        </div>
    </div>
</div>
