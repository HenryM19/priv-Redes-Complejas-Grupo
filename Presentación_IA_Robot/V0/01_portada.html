<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>01 · Portada</title>
<script>document.documentElement.dataset.theme = (function(){try{return localStorage.getItem('ic-theme')||'dark'}catch(e){return 'dark'}})();</script>
<link rel="stylesheet" href="theme.css">
<style>
.slide { text-align:center; }
.bgvid {
    position:absolute; inset:0; width:100%; height:100%;
    object-fit:cover; opacity:0.22;
}
html[data-theme="light"] .bgvid { opacity:0.14; }
.veil {
    position:absolute; inset:0;
    background:radial-gradient(ellipse at center, var(--veil-a) 0%, var(--veil-b) 100%);
}
.content { position:relative; z-index:2; animation:rise 1.2s ease both; }

.kicker {
    display:inline-block; font-size:1.05rem; letter-spacing:0.35em; color:var(--text-2);
    border:1.5px solid var(--chip-border); border-radius:40px; padding:0.6rem 1.8rem;
    margin-bottom:2.2rem; text-transform:uppercase; font-weight:700;
    animation:glow 3s ease-in-out infinite;
}
@keyframes glow {
    0%,100% { box-shadow:0 0 8px var(--chip-bg); }
    50%     { box-shadow:0 0 26px var(--chip-bg), 0 0 10px var(--chip-bg); }
}
h1 {
    font-size:3.9rem; font-weight:800; line-height:1.12;
    max-width:14em; margin:0 auto; color:var(--heading);
}
.sub1 { margin-top:1.4rem; font-size:1.45rem; color:var(--accent); }

.flowline {
    position:relative; z-index:2; margin-top:2.6rem;
    display:flex; gap:1rem; align-items:center; justify-content:center;
    font-size:1.1rem; color:var(--text-2); font-weight:700;
}
.dot { width:0.55rem; height:0.55rem; border-radius:50%; background:var(--accent); animation:blink 1.6s infinite; }
.dot:nth-of-type(2) { animation-delay:0.4s; }
.dot:nth-of-type(3) { animation-delay:0.8s; }
@keyframes blink { 0%,100%{opacity:0.25;} 50%{opacity:1;} }

.authors { position:relative; z-index:2; margin-top:2.6rem; font-size:1.3rem;
           color:var(--heading); animation:rise 1.2s .4s ease both; }
.authors b { font-weight:800; }
.authors span { color:var(--muted); font-size:1.05rem; }

.logos {
    position:relative; z-index:2; margin-top:1.6rem; display:flex;
    background:#fff; border:1px solid var(--nav-border); border-radius:16px;
    padding:0.8rem 1.8rem; align-items:center;
    animation:rise 1.2s .6s ease both; box-shadow:var(--shadow);
}
.logos img { height:3.4rem; display:block; }
</style>
</head>
<body>
<div class="slide">
    <video class="bgvid" autoplay muted loop playsinline>
        <source src="videos/entrenamiento_issac_sim_recorrido.mp4" type="video/mp4">
    </video>
    <div class="veil"></div>

    <div class="content">
        <div class="kicker">Intrinsic Challenge → IA</div>
        <h1>Resolviendo problemas de robótica clásica<br>en tiempos de IA</h1>
        <p class="sub1">Del modelado a mano al aprendizaje en simulación masiva</p>
    </div>

    <div class="flowline">
        <span>Problema</span><span class="dot"></span>
        <span>Aprendizaje</span><span class="dot"></span>
        <span>Simulación</span><span class="dot"></span>
        <span>Mundo real</span>
    </div>

    <div class="authors">
        <b>Jean Aucapiña</b> · <b>Henry Maldonado</b><br>
        <span>Universidad de Cuenca · 2026</span>
    </div>

    <div class="logos">
        <img src="assets/logo_deet.jpeg" alt="UCUENCA · DEET">
    </div>
</div>

<script>window.SLIDE = { index:1, total:11, next:'02_problema.html' };</script>
<script src="theme.js"></script>
</body>
</html>
