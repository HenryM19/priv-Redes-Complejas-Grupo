<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diagnóstico y Rediseño · Red UCuenca · Redes Complejas</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap');
  :root{--bg:#e9edf5;--ink:#101725;--muted:#69748a;--blue:#2f6bff;--crit:#e23a56;--line:#cdd6e6}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:var(--bg);font-family:'Space Grotesk',system-ui,sans-serif;overflow:hidden}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #frameWrap{width:1280px;height:720px;transform-origin:center center;
    box-shadow:0 30px 80px rgba(20,30,60,.28);border-radius:12px;overflow:hidden;background:#fff}
  iframe{width:1280px;height:720px;border:0;display:block}
  #bar{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);
    display:flex;align-items:center;gap:14px;z-index:50;
    background:rgba(255,255,255,.86);backdrop-filter:blur(10px);
    border:1px solid var(--line);border-radius:999px;padding:8px 16px;
    box-shadow:0 10px 30px rgba(20,30,60,.16);opacity:.28;transition:opacity .25s}
  #bar:hover{opacity:1}
  #bar button{border:0;background:transparent;cursor:pointer;color:var(--ink);
    font-size:17px;width:34px;height:34px;border-radius:50%;transition:background .15s}
  #bar button:hover{background:#eef2fb}
  #counter{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--muted);min-width:74px;text-align:center}
  #label{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--blue);
    max-width:280px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #prog{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--blue),var(--crit));
    width:0;z-index:60;transition:width .35s cubic-bezier(.2,.7,.2,1)}
  #ov{position:fixed;inset:0;z-index:80;background:radial-gradient(120% 90% at 50% 0%,#f4f6fb,#dce3f0);
    display:none;padding:52px 56px;overflow-y:auto}
  #ov.show{display:block}
  #ov h3{font-size:22px;color:var(--ink);margin-bottom:4px}
  #ov p{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);
    letter-spacing:.12em;text-transform:uppercase;margin-bottom:26px}
  .wall{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
  .thumb{position:relative;aspect-ratio:16/9;border-radius:10px;overflow:hidden;cursor:pointer;
    background:#fff;border:1px solid var(--line);box-shadow:0 8px 20px rgba(20,30,60,.10);
    transition:transform .22s cubic-bezier(.2,.7,.2,1),box-shadow .22s}
  .thumb:hover{transform:translateY(-4px) scale(1.02);box-shadow:0 20px 44px rgba(20,30,60,.22)}
  .thumb iframe{position:absolute;top:0;left:0;width:1280px;height:720px;
    transform:scale(.2461);transform-origin:top left;pointer-events:none}
  .thumb .cap{position:absolute;left:0;right:0;bottom:0;background:rgba(16,23,37,.82);color:#fff;
    font-family:'JetBrains Mono',monospace;font-size:10px;padding:6px 8px;display:flex;gap:7px}
  .thumb .cap b{color:#7fb0ff}
  #ovBtn{position:fixed;top:16px;right:18px;z-index:70;font-family:'JetBrains Mono',monospace;
    font-size:12px;letter-spacing:.1em;color:var(--muted);background:rgba(255,255,255,.86);
    border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer}
  .hint{position:fixed;bottom:22px;right:22px;z-index:50;font-family:'JetBrains Mono',monospace;
    font-size:11px;color:var(--muted);opacity:.6}
</style>
</head>
<body>
<div id="prog"></div>
<button id="ovBtn">▦ Índice · ESC</button>
<div id="stage">
  <div id="frameWrap"><iframe id="deck" src=""></iframe></div>
</div>
<div id="bar">
  <button id="prev" title="Anterior (←)">◀</button>
  <span id="counter">01 / 35</span>
  <button id="next" title="Siguiente (→)">▶</button>
  <span id="label"></span>
</div>
<div class="hint">← → espacio · ESC índice</div>
<div id="ov">
  <h3>Diagnóstico y Rediseño de la Red UCuenca</h3>
  <p>Proyecto Final · Módulo 1217 · Redes Complejas · haz clic en cualquier lámina</p>
  <div class="wall" id="wall"></div>
</div>
<script>
const SLIDES = [
  {f:"slides/01-portada.html",                  t:"Portada"},
  {f:"slides/02-caso-estudio.html",              t:"Caso de estudio · Red UCuenca"},
  {f:"slides/03-topologia.html",                 t:"Vista estructural · Topología real"},
  {f:"slides/04-agenda.html",                    t:"Agenda · 5 fases"},
  {f:"slides/05-resumen-ejecutivo.html",         t:"Resumen ejecutivo · 3 hallazgos"},
  {f:"slides/06-p1-metricas-basicas.html",       t:"P1 · Métricas básicas"},
  {f:"slides/07-p1-distribucion-grado.html",     t:"P1 · Distribución de grado y MLE"},
  {f:"slides/08-p1-centralidades.html",          t:"P1 · Centralidades"},
  {f:"slides/09-explorador-red.html",            t:"Explora la red · grafo interactivo"},
  {f:"slides/10-p1-puentes-articulacion.html",   t:"P1 · Puentes y articulación"},
  {f:"slides/11-p2-modelos-nulos.html",          t:"P2 · Modelos nulos ER/CM"},
  {f:"slides/12-p2-barabasi-albert.html",        t:"P2 · Barabási-Albert"},
  {f:"slides/13-p3-bfs-dfs-ciclos.html",         t:"P3 · BFS, DFS y ciclos"},
  {f:"slides/14-p4-louvain.html",                t:"P4 · Louvain y modularidad"},
  {f:"slides/15-p4-kmeans-espectral.html",       t:"P4 · k-means espectral"},
  {f:"slides/16-p5-caminos-minimos.html",        t:"P5 · Caminos mínimos"},
  {f:"slides/17-p6-flujo-maximo.html",           t:"P6 · Flujo máximo y corte mínimo"},
  {f:"slides/18-p7-p-mediana.html",              t:"P7 · p-Mediana"},
  {f:"slides/19-p7-p-centro.html",               t:"P7 · p-Centro"},
  {f:"slides/20-p7-hallazgo-gap.html",           t:"P7 · El gap del 100%"},
  {f:"slides/21-p8-percolacion-nodos.html",      t:"P8 · Percolación de nodos"},
  {f:"slides/22-p8-percolacion-aristas.html",    t:"P8 · Percolación de aristas"},
  {f:"slides/23-p8-paradoja-robustez.html",      t:"P8 · Paradoja de la robustez"},
  {f:"slides/24-p9-cascada-motter-lai.html",     t:"P9 · Cascadas Motter-Lai"},
  {f:"slides/25-p9-sir-epidemico.html",          t:"P9 · Modelo SIR"},
  {f:"slides/26-p9-inmunizacion.html",           t:"P9 · Inmunización"},
  {f:"slides/27-p10-icc.html",                   t:"P10 · Índice de Criticidad Compuesto"},
  {f:"slides/28-p11-cinco-enlaces.html",         t:"P11 · Cinco enlaces propuestos"},
  {f:"slides/29-p11-antes-despues.html",         t:"P11 · Antes y después"},
  {f:"slides/30-p11-alternativas.html",          t:"P11 · Comparación con alternativas"},
  {f:"slides/31-limitaciones.html",              t:"Limitaciones del estudio"},
  {f:"slides/32-preguntas-fase1-2.html",         t:"Preguntas · Fases 1 y 2"},
  {f:"slides/33-conclusiones.html",              t:"Conclusiones generales"},
  {f:"slides/34-preguntas-fase3-4.html",         t:"Preguntas · Fases 3 y 4"},
  {f:"slides/35-referencias.html",               t:"Referencias y cierre"},
];
const N=SLIDES.length; let i=0;
const deck=document.getElementById('deck'),wrap=document.getElementById('frameWrap');
const counter=document.getElementById('counter'),label=document.getElementById('label');
const prog=document.getElementById('prog'),ov=document.getElementById('ov');
function pad(n){return String(n).padStart(2,'0')}
function show(n){i=Math.max(0,Math.min(N-1,n));deck.src=SLIDES[i].f;
  counter.textContent=pad(i+1)+" / "+pad(N);label.textContent=SLIDES[i].t;
  prog.style.width=((i+1)/N*100)+"%";}
function next(){show(i+1)} function prev(){show(i-1)}
function fit(){const s=Math.min(window.innerWidth/1280,window.innerHeight/720)*.94;wrap.style.transform="scale("+s+")";}
window.addEventListener('resize',fit);
document.getElementById('next').onclick=next;
document.getElementById('prev').onclick=prev;
document.getElementById('ovBtn').onclick=()=>toggleOv();
document.addEventListener('keydown',e=>{
  if(ov.classList.contains('show')){if(e.key==='Escape')toggleOv(false);return;}
  if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();next()}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();prev()}
  else if(e.key==='Home')show(0);else if(e.key==='End')show(N-1);
  else if(e.key==='Escape')toggleOv(true);
  else if(/^[1-9]$/.test(e.key))show(parseInt(e.key)-1);
});
let ovBuilt=false;
function buildOv(){const wall=document.getElementById('wall');
  SLIDES.forEach((s,idx)=>{const d=document.createElement('div');d.className='thumb';
    d.innerHTML='<iframe loading="lazy" src="'+s.f+'"></iframe><div class="cap"><b>'+pad(idx+1)+'</b>'+s.t+'</div>';
    d.onclick=()=>{show(idx);toggleOv(false)};wall.appendChild(d);});ovBuilt=true;}
function toggleOv(force){const willShow=force===undefined?!ov.classList.contains('show'):force;
  if(willShow&&!ovBuilt)buildOv();ov.classList.toggle('show',willShow);}
fit();show(0);
</script>
</body>
</html>
