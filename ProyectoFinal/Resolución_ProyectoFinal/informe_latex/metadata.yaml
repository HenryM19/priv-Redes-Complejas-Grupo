---
title: "Análisis de Redes Complejas"
subtitle: "Caso de estudio: la red de datos de la Universidad de Cuenca --- Módulo 1217, Redes Complejas"
author:
  - "Jean Carlo Aucapiña (jean.aucapina@ucuenca.edu.ec)"
  - "Henry Maldonado (henrry.maldonado@ucuenca.edu.ec)"
date: "26 de agosto de 2026"
abstract: |
  Se analiza la infraestructura de red de datos de la Universidad de Cuenca (177 nodos, 209 aristas, topología jerárquica core-agregación-acceso) mediante los once problemas del módulo de Redes Complejas, cubriendo caracterización estructural, modelos nulos, recorridos y comunidades, optimización (caminos mínimos, flujo máximo, localización), robustez (percolación, cascadas, epidemias) y una propuesta de rediseño acotada a cinco enlaces.

  **Hallazgo 1:** la red es jerárquica por diseño, no emergente — densidad 0.013, clustering 0.034, asortatividad negativa (r=-0.147) — y el ajuste de ley de potencia sobre su distribución de grado no es estadísticamente concluyente (p-value bootstrap = 0.754 sobre una cola de solo 20 nodos).

  **Hallazgo 2:** para el problema de localización p-centro, la heurística voraz estándar tiene un gap de hasta 100% frente al óptimo exacto (solver de programación entera), mientras que para p-mediana el gap es marginal — verificado contrastando ambos métodos para p en {1,2,3,5}.

  **Hallazgo 3:** la red exhibe la paradoja clásica de robustez de redes heterogéneas: estructuralmente resistente a fallos aleatorios y cascadas de sobrecarga (ningún nodo del top-5 por intermediación dispara una cascada que afecte al 20% de la red, ni con tolerancia cero), pero vulnerable a epidemias dirigidas a sus hubs (un brote SIR con beta = 2 veces el umbral crítico infecta ~79% de los nodos en promedio, reducible a ~3% inmunizando por grado con solo 20% de cobertura).

  La propuesta final de cinco enlaces, guiada por un índice compuesto de criticidad, mejora la eficiencia global en 11.9% y la distancia media en 14.7%, pero no modifica el umbral de percolación bajo ataque dirigido — evidencia de que mejorar la operación normal y blindar contra ataques deliberados son objetivos distintos que requieren intervenciones distintas.
